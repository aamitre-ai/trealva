<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trealva</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    .hero-bg { position: fixed; inset: 0; z-index: 0; background-image: url('https://images.unsplash.com/photo-1547995886-6dc09384c6e6?w=1600&q=80'); background-size: cover; background-position: center; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1; }
    .logo { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
    .logo img { width: clamp(200px, 40vw, 480px); height: auto; }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="overlay"></div>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/aamitre-ai/trealva/main/assets/trealva-logo-white.png" alt="Trealva">
  </div>
</body>
</html>
